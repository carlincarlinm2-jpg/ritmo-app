<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<title>Ritmo</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--ink:#101019;--ink2:#3a3a4a;--muted:#7a7a8c;--line:#e9e9f0;--brand:#6d5dfc;--brand-d:#4b3be0;--soft:#efedff;--ok:#12b76a;--warn:#f59e0b;--danger:#e0445a;--r:22px;
  --m-manana:#f59e0b;--m-tarde:#f97316;--m-noche:#6366f1;--m-cualquiera:#10b981}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}
html.sheet-open,html.sheet-open body{overflow:hidden}
.ic{display:block;flex:0 0 auto}

/* ---------- Estructura ---------- */
.shell{min-height:100vh}
.side{display:none}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 0 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.03em}
.logo svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.icon-btn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* Héroe */
.hero{margin:10px 16px 0;padding:22px 20px;border-radius:28px;background:radial-gradient(120% 90% at 100% 0,#dcd6ff 0,rgba(220,214,255,0) 60%),radial-gradient(90% 80% at 0 100%,#d8f3ff 0,rgba(216,243,255,0) 60%),var(--card);box-shadow:0 18px 40px -26px rgba(75,59,224,.45)}
.hero-hello{font-size:26px;font-weight:800;letter-spacing:-.03em;padding-right:96px}
.hero-date{color:var(--muted);font-size:14px;margin-top:2px}
.hero-stats{display:flex;align-items:center;gap:18px;margin-top:18px}
.ring{flex:0 0 auto}
.ring text{fill:var(--ink)}
.hero-num{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero-sub{color:var(--ink2);font-size:14px;margin-top:4px}

/* Secciones y tarjetas */
.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 22px 0;font-size:18px;font-weight:700;gap:8px}
.section-title .count{font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--card);margin:10px 16px;border-radius:var(--r);box-shadow:0 1px 2px rgba(16,16,25,.04),0 10px 30px -22px rgba(16,16,25,.3)}
.card.pad{padding:16px}
.moment{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-weight:700;font-size:14px;color:var(--ink2)}
.moment .dotm{width:10px;height:10px;border-radius:50%}
.moment .prog{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:rgba(0,0,0,.02)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15.5px;line-height:1.25}
.row-sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.done .row-title{color:var(--muted);text-decoration:line-through}
.check{width:28px;height:28px;border-radius:50%;border:2px solid #d5d5e0;display:grid;place-items:center;flex:0 0 auto;color:#fff;transition:all .18s}
.row.done .check{background:var(--ok);border-color:var(--ok);transform:scale(1.05)}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;background:#f1f1f6;color:var(--ink2)}
.tag.warn{background:#fff3dc;color:#b45309}.tag.brand{background:var(--soft);color:var(--brand-d)}
.streak{display:inline-flex;align-items:center;gap:3px;color:#ea580c;font-weight:700;font-size:12.5px}
.row-end{font-weight:700;font-size:14px;white-space:nowrap}
.menu-btn{border:0;background:none;color:#b3b3c2;padding:6px;border-radius:50%;cursor:pointer}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}

/* Aviso de notificaciones */
.notif-card{display:flex;gap:14px;align-items:flex-start;padding:16px;background:linear-gradient(135deg,#efedff,var(--card) 70%)}
.notif-ic{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.notif-card b{display:block;font-size:15.5px}
.notif-card p{margin:4px 0 10px;font-size:13.5px;color:var(--ink2);line-height:1.4}
.steps-ios{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2);line-height:1.6}

/* Plantillas */
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px}
.tpl{border:0;border-radius:20px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tpl b{font-size:15px;margin-top:auto}.tpl span{font-size:12.5px;color:var(--ink2)}
.tpl .tic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.t-am{background:linear-gradient(145deg,#fff4dc,#ffe6b8)}.t-am .tic{color:#d97706}
.t-pm{background:linear-gradient(145deg,#ecebff,#dcd9ff)}.t-pm .tic{color:#5b54d6}
.t-fit{background:linear-gradient(145deg,#e3f8ee,#ccf0dd)}.t-fit .tic{color:#059669}
.t-focus{background:linear-gradient(145deg,#ffe8ee,#ffd3de)}.t-focus .tic{color:#e11d48}

/* Botones */
.btn{border:0;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:8px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.brand{background:var(--brand)}
.btn.sm{width:auto;padding:10px 14px;border-radius:12px;font-size:14px;margin:0}
.btn[disabled]{opacity:.5}
.link{border:0;background:none;color:var(--brand-d);font-weight:700;cursor:pointer;padding:0;font-size:14px}

/* Barra inferior */
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100vw - 24px);max-width:520px;height:68px;border-radius:24px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border:1px solid rgba(0,0,0,.05);box-shadow:0 12px 34px -12px rgba(16,16,25,.3);display:flex;align-items:center;padding:0 6px;z-index:20}
.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#8e8ea0;cursor:pointer;padding:6px 0}
.bottom button.active{color:var(--ink)}
.fab{width:60px!important;height:60px;flex:0 0 60px!important;margin-top:-30px;border-radius:50%!important;background:linear-gradient(135deg,#8b7bff,#4b3be0)!important;color:#fff!important;display:grid!important;place-items:center;border:4px solid var(--bg)!important;box-shadow:0 10px 24px -8px rgba(75,59,224,.7)}
.fab .ic{width:28px;height:28px}

/* Hojas */
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.45);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:50;overscroll-behavior:contain}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;overscroll-behavior:contain;animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:#e1e1ea;margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.sheet-head h2{font-size:22px}.sheet-head p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.close{border:0;background:#f1f1f6;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.field{margin:12px 0}
.field label{display:block;font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-size:16px;background:#fafafd;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--brand);background:#fff}
.seg{display:flex;background:#f1f1f6;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 4px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.days{display:flex;gap:6px}
.days button{flex:1;border:0;height:40px;border-radius:12px;background:#f1f1f6;font-weight:700;color:var(--ink2);cursor:pointer}
.days button.on{background:var(--brand);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Captura por voz */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 4px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:linear-gradient(135deg,#8b7bff,#4b3be0);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 30px -10px rgba(75,59,224,.7);position:relative}
.mic .ic{width:40px;height:40px}
.mic.rec{background:linear-gradient(135deg,#ff6b81,#e0445a)}
.mic.rec:before,.mic.rec:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(224,68,90,.35);animation:ripple 1.4s ease-out infinite}
.mic.rec:after{animation-delay:.7s}
@keyframes ripple{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.mic-hint{font-size:13.5px;color:var(--muted);text-align:center}
.bars{display:flex;gap:4px;height:22px;align-items:center}
.bars i{width:4px;border-radius:4px;background:var(--danger);animation:bar 0.9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.2s}.bars i:nth-child(4){animation-delay:.3s}.bars i:nth-child(5){animation-delay:.4s}
@keyframes bar{0%,100%{height:5px}50%{height:22px}}
.preview{border-radius:18px;background:var(--soft);padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center}
.preview .pic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--brand-d);flex:0 0 auto}
.preview b{display:block}.preview span{font-size:13px;color:var(--ink2)}

/* Login */
.auth{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:none}
.auth.open{display:block}
.auth-box{max-width:440px;margin:0 auto;min-height:100vh;padding:48px 20px 30px;display:flex;flex-direction:column;justify-content:center}
.auth-logo{display:flex;justify-content:center;margin-bottom:14px}
.auth h1{text-align:center;font-size:34px}
.auth .sub{text-align:center;color:var(--ink2);margin:8px 0 22px;line-height:1.45}
.auth .sub b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.auth-card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 10px 35px -20px rgba(0,0,0,.25)}
.err{background:#ffeef0;color:#b4233a;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px;display:none}
.switch{text-align:center;margin-top:14px;font-size:14px;color:var(--muted)}

/* Splash y saludo */
.splash{position:fixed;inset:0;background:var(--bg);z-index:70;display:grid;place-items:center;transition:opacity .35s}
.splash.hide{opacity:0;pointer-events:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 16px 8px 8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;display:flex;gap:8px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;pointer-events:none;z-index:90;font-size:18px;animation:conf 1.1s ease-out forwards}
@keyframes conf{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}

/* ---------- Computadora ---------- */
@media (min-width:900px){
  .bottom{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;top:0;left:0;bottom:0;width:250px;padding:26px 16px;background:var(--card);border-right:1px solid var(--line);z-index:10}
  .side .logo{padding:0 10px 18px}
  .side button.nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:14px;font-weight:600;font-size:15px;color:var(--ink2);cursor:pointer;text-align:left}
  .side button.nav.active{background:var(--soft);color:var(--brand-d)}
  .side .btn{margin-top:10px}
  main{margin-left:250px;max-width:none;padding:28px 36px 60px}
  .top{display:none}
  .wide{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;align-items:start;max-width:1180px}
  .card,.hero,.tpls{margin-left:0;margin-right:0}
  .section-title{margin-left:4px;margin-right:4px}
  .overlay{align-items:center}
  .sheet{border-radius:28px;max-height:86vh}
  .tpls{grid-template-columns:repeat(4,1fr)}
}

/* ---------- Colores según la hora ---------- */
html[data-time="sunset"]{--bg:#fcece0;--card:#fff9f3;--line:#f3dfcf;--soft:#ffe7d4;--brand:#f06b3a;--brand-d:#c2410c}
html[data-time="sunset"] body{background:linear-gradient(180deg,#ffc79a 0,#ffdcbd 200px,#fcece0 480px) fixed}
html[data-time="sunset"] .hero{background:radial-gradient(120% 90% at 100% 0,#ffc38f 0,rgba(255,195,143,0) 60%),radial-gradient(90% 80% at 0 100%,#ffd0d6 0,rgba(255,208,214,0) 60%),#fff3e6}
html[data-time="sunset"] .fab,html[data-time="sunset"] .mic:not(.rec){background:linear-gradient(135deg,#ff9a5a,#e0582a)!important}
html[data-time="night"]{--bg:#0e0e16;--card:#181824;--ink:#f1f1f7;--ink2:#c9c9d8;--muted:#8d8da3;--line:#27273a;--soft:#232046;color-scheme:dark}
html[data-time="night"] body{background:linear-gradient(180deg,#1b1840 0,#0e0e16 360px) fixed}
html[data-time="night"] .hero{background:radial-gradient(120% 90% at 100% 0,rgba(139,123,255,.28) 0,rgba(139,123,255,0) 60%),radial-gradient(90% 80% at 0 100%,rgba(56,189,248,.14) 0,rgba(56,189,248,0) 60%),var(--card);box-shadow:none}
html[data-time="night"] .card{box-shadow:none}
html[data-time="night"] .bottom{background:rgba(24,24,36,.9);border-color:rgba(255,255,255,.06)}
html[data-time="night"] .bottom button.active{color:#fff}
html[data-time="night"] .btn{background:#8b7bff;color:#fff}
html[data-time="night"] .btn.alt{background:var(--card);color:var(--ink)}
html[data-time="night"] .tag,html[data-time="night"] .seg,html[data-time="night"] .days button,html[data-time="night"] .close,html[data-time="night"] .field input,html[data-time="night"] .field select,html[data-time="night"] .field textarea{background:#22222f;color:var(--ink);border-color:var(--line)}
html[data-time="night"] .seg button.on{background:#34344a;color:#fff}
html[data-time="night"] .check{border-color:#3a3a50}
html[data-time="night"] .notif-card{background:linear-gradient(135deg,#232046,var(--card) 70%)}
html[data-time="night"] .t-am{background:linear-gradient(145deg,#3a2c10,#2a200c)}html[data-time="night"] .t-pm{background:linear-gradient(145deg,#232046,#1b1838)}
html[data-time="night"] .t-fit{background:linear-gradient(145deg,#113325,#0c261b)}html[data-time="night"] .t-focus{background:linear-gradient(145deg,#3a1520,#2b1018)}
html[data-time="night"] .tpl{color:var(--ink)}html[data-time="night"] .tpl span{color:var(--muted)}html[data-time="night"] .tpl .tic{background:rgba(255,255,255,.08)}
html[data-time="night"] .fab{border-color:var(--bg)!important}
html[data-time="night"] .preview .pic,html[data-time="night"] .icon-btn{background:#22222f;color:var(--ink)}
html[data-time="night"] .toast{background:#f1f1f7;color:#0e0e16}

/* ===== Luna (mascota) ===== */
.moon{display:block;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
.moon .mo-body{transform-box:view-box;transform-origin:100px 170px}
.moon .mo-shadow{transform-box:fill-box;transform-origin:50% 50%}
.moon .mo-hand{transform-box:view-box;transform-origin:150px 100px;opacity:0}
.moon .mo-open,.moon .mo-sleepeyes,.moon .mo-snore,.moon .mo-zzz,.moon .mo-stars{opacity:0}
.moon .mo-glasses{transform-box:fill-box;transform-origin:50% 50%}
.moon .mo-glow{animation:moGlow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.moon .mo-glint{animation:moGlint 4s ease-in-out infinite}
.moon.mood-idle .mo-body{animation:moAlive 5s cubic-bezier(.45,.05,.35,1) infinite}
.moon.mood-idle .mo-shadow,.moon.mood-wave .mo-shadow{animation:moShadow 5s ease-in-out infinite}
.moon.mood-wave .mo-body{animation:moGroove 1.6s ease-in-out infinite}
.moon.mood-wave .mo-hand{opacity:1;animation:moWave .7s ease-in-out infinite}
.moon.mood-wave .mo-smile{opacity:0}.moon.mood-wave .mo-open{opacity:1}
.moon.mood-wave .mo-glasses{animation:moCool 3.2s ease-in-out infinite}
.moon.mood-happy .mo-body{animation:moBounce 1s cubic-bezier(.3,.7,.4,1) infinite}
.moon.mood-happy .mo-smile{opacity:0}.moon.mood-happy .mo-open{opacity:1}
.moon.mood-celebrate .mo-body{animation:moJump .85s cubic-bezier(.3,.7,.4,1) infinite}
.moon.mood-celebrate .mo-smile{opacity:0}.moon.mood-celebrate .mo-open,.moon.mood-celebrate .mo-stars{opacity:1}
.moon.mood-celebrate .mo-stars path{transform-box:fill-box;transform-origin:50% 50%;animation:moStar 1.1s ease-in-out infinite}
.moon.mood-celebrate .mo-stars path:nth-child(2){animation-delay:.35s}.moon.mood-celebrate .mo-stars path:nth-child(3){animation-delay:.7s}
.moon.mood-think .mo-body{animation:moThink 1.4s ease-in-out infinite}
.moon.mood-sleep .mo-body{animation:moBreath 3.6s ease-in-out infinite}
.moon.mood-sleep .mo-glasses{transform:translateY(-38px) rotate(-5deg)}
.moon.mood-sleep .mo-glint{display:none}
.moon.mood-sleep .mo-smile{opacity:0}.moon.mood-sleep .mo-sleepeyes,.moon.mood-sleep .mo-snore,.moon.mood-sleep .mo-zzz{opacity:1}
.moon.mood-sleep .mo-snore{transform-box:fill-box;transform-origin:50% 50%;animation:moSnore 3.6s ease-in-out infinite}
.moon .mo-zzz text{opacity:0;animation:moZ 3s ease-in-out infinite}.moon .mo-zzz text:nth-child(2){animation-delay:1s}.moon .mo-zzz text:nth-child(3){animation-delay:2s}
.moon.poked .mo-body{animation:moPoke .9s cubic-bezier(.3,.7,.4,1)!important}
.moon.poked .mo-smile{opacity:0}.moon.poked .mo-open{opacity:1}
.moon.mood-sleep.poked .mo-glasses{transform:none;transition:transform .2s}.moon.mood-sleep.poked .mo-sleepeyes,.moon.mood-sleep.poked .mo-zzz{opacity:0}

function greeting(){const t=timeOfDay();return t==='day'?'Buenos días':t==='sunset'?'Buenas tardes':'Buenas noches'}
function themePref(){try{return localStorage.getItem('ritmo_theme')||'auto'}catch(e){return 'auto'}}
function applyTheme(){const p=themePref(),t=p==='auto'?timeOfDay():p==='dark'?'night':'day';document.documentElement.dataset.time=t;const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='night'?'#0e0e16':t==='sunset'?'#fcece0':'#f4f4f7'}
setInterval(()=>{applyTheme();if(user)render()},5*60*1000);

/* ====================== UI helpers ====================== */
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML='<div class="grab"></div>'+html;hydrateIcons(s);document.getElementById('overlay').classList.add('open');document.documentElement.classList.add('sheet-open')}
function closeSheet(){stopListening();document.getElementById('overlay').classList.remove('open');document.documentElement.classList.remove('sheet-open')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
function head(t,sub){return `<div class="sheet-head"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close" onclick="closeSheet()" aria-label="Cerrar">${ic('close',18)}</button></div>`}
let toastT;function toast(msg,icn='check'){const t=document.getElementById('toast');t.innerHTML=moonSVG(30,'happy')+esc(msg);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}
function confetti(x,y){const e=['✦','●','▲','✦'],c=['#6d5dfc','#12b76a','#f59e0b','#ec4899'];for(let i=0;i<14;i++){const s=document.createElement('span');s.className='confetti';s.textContent=e[i%4];s.style.color=c[i%4];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*160-80)+'px');s.style.setProperty('--dy',(-40-Math.random()*120)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function segPick(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}

function showSignup(on){document.getElementById('loginCard').style.display=on?'none':'block';document.getElementById('signupCard').style.display=on?'block':'none';
  document.getElementById('authSub').innerHTML=on?'<b>¡Qué gusto tenerte aquí!</b>Crea tu cuenta y en un minuto armamos tu rutina.':'<b>¡Hola! Vamos a darle ritmo a tu día.</b>Tus rutinas, pendientes y recordatorios, en un solo lugar.'}
function authErr(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block'}
async function login(){
  const email=lEmail.value.trim(),password=lPass.value;if(!email||!password)return authErr('loginErr','Escribe tu correo y contraseña.');
  lBtn.disabled=true;const {data,error}=await sb.auth.signInWithPassword({email,password});lBtn.disabled=false;
  if(error)return authErr('loginErr',error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message.includes('confirm')?'Primero confirma tu correo (revisa tu bandeja).':error.message);
  await start(data.user);
}
async function signup(){
  const name=sName.value.trim(),email=sEmail.value.trim(),password=sPass.value;
  if(!name)return authErr('signupErr','Escribe tu nombre.');if(!email.includes('@'))return authErr('signupErr','Escribe un correo válido.');if(password.length<6)return authErr('signupErr','La contraseña debe tener al menos 6 caracteres.');
  sBtn.disabled=true;const {data,error}=await sb.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.origin}});sBtn.disabled=false;
  if(error)return authErr('signupErr',error.message.includes('registered')?'Ese correo ya tiene cuenta. Inicia sesión (sirve la misma de Nutri).':error.message);
  if(!data.session){showSignup(false);authErr('loginErr','Te mandamos un correo de confirmación. Ábrelo y luego inicia sesión aquí.');return}
  await start(data.user,true);
}
async function logout(){await sb.auth.signOut();user=null;items=[];logs=[];closeSheet();document.getElementById('auth').classList.add('open')}
function userName(){return (user?.user_metadata?.name||user?.email?.split('@')[0]||'').split(' ')[0]}

/* ====================== Datos ====================== */
async function loadData(){
  const since=new Date();since.setDate(since.getDate()-90);
  const [a,b]=await Promise.all([sb.from('rt_items').select('*').eq('app','ritmo').order('sort').order('created_at'),sb.from('rt_habit_log').select('item_id,day').gte('day',dkey(since))]);
  if(a.error)console.error(a.error);items=a.data||[];logs=b.data||[];
  const qs=new Date();qs.setDate(qs.getDate()-800);
  const [q,ql]=await Promise.all([sb.from('rt_quits').select('*').order('created_at'),sb.from('rt_quit_log').select('quit_id,day,clean').gte('day',dkey(qs))]);
  quits=q.data||[];qlogs=ql.data||[];
}
function isLogged(id,day=today()){return logs.some(l=>l.item_id===id&&l.day===day)}
function streakOf(h){let n=0;const d=new Date();if(!isLogged(h.id,dkey(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<120;i++){if((h.days||[]).includes(d.getDay())){if(isLogged(h.id,dkey(d)))n++;else break}d.setDate(d.getDate()-1)}return n}
// Racha de días: días seguidos (hasta hoy o ayer) en los que cumpliste TODOS tus hábitos de ese día.
function dayStreak(){
  const hs=items.filter(i=>i.kind==='habit');if(!hs.length)return 0;
  const complete=d=>{const due=hs.filter(h=>(h.days||[]).includes(d.getDay())&&new Date(h.created_at||0)<=new Date(dkey(d)+'T23:59:59'));return due.length&&due.every(h=>isLogged(h.id,dkey(d)))};
  const d=new Date();let n=0;if(!complete(d))d.setDate(d.getDate()-1);
  for(let i=0;i<365;i++){const due=hs.some(h=>(h.days||[]).includes(d.getDay()));if(!due){d.setDate(d.getDate()-1);continue}if(complete(d)){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}
function habitsToday(){const wd=new Date().getDay();return items.filter(i=>i.kind==='habit'&&(i.days||[]).includes(wd))}
function todosToday(){const t=today();return items.filter(i=>i.kind==='todo'&&(i.on_date===t||(!i.done&&i.on_date<t)))}
function remindersUpcoming(){return items.filter(i=>i.kind==='reminder'&&!i.done).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at))}

async function toggleHabit(id,el){
  const day=today();
  if(isLogged(id,day)){logs=logs.filter(l=>!(l.item_id===id&&l.day===day));render();await sb.from('rt_habit_log').delete().eq('item_id',id).eq('day',day)}
  else{logs.push({item_id:id,day});if(el){const r=el.getBoundingClientRect();confetti(r.left+r.width-30,r.top+10)}render();
    await sb.from('rt_habit_log').insert({item_id:id,user_id:user.id,day});
    checkDayComplete()}
}
async function toggleDone(id,el){
  const it=items.find(i=>i.id===id);if(!it)return;it.done=!it.done;it.done_at=it.done?new Date().toISOString():null;
  if(it.done&&el){const r=el.getBoundingClientRect();confetti(r.left+r.width-30,r.top+10)}
  render();if(it.done)checkDayComplete();await sb.from('rt_items').update({done:it.done,done_at:it.done_at}).eq('id',id);
}
function checkDayComplete(){
  const hs=habitsToday(),td=todosToday();
  if(!hs.length&&!td.length)return;
  if(!hs.every(h=>isLogged(h.id))||!td.every(t=>t.done))return;
  const k='ritmo_celebrated_'+today();try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1')}catch(e){}
  setTimeout(()=>celebrate(dayStreak()),450);
}
function celebrate(streak){
  const msgs={1:'¡Primer día completo!',3:'¡3 días seguidos! Ya agarraste ritmo.',7:'¡Una semana completa!',14:'¡Dos semanas! Eres imparable.',30:'¡Un mes entero! Leyenda.'};
  const el=document.createElement('div');el.className='celebrate';
  el.innerHTML=`<div class="cel-card">${moonSVG(150,'celebrate')}<div class="cel-flame">${ic('flame',30)}<b>${streak||1}</b></div><h2>¡Día completo!</h2><p>${msgs[streak]||(streak>1?`Llevas ${streak} días seguidos cumpliendo todo.`:'Terminaste todo lo de hoy. ¡Así se hace!')}</p><button class="btn brand">¡Vamos!</button></div>`;
  el.addEventListener('click',()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)});
  document.body.appendChild(el);
  for(let i=0;i<4;i++)setTimeout(()=>confetti(window.innerWidth*(.2+Math.random()*.6),window.innerHeight*.35),i*180);
  try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}
}
async function removeItem(id){if(!confirm('¿Borrar?'))return;items=items.filter(i=>i.id!==id);closeSheet();render();await sb.from('rt_items').delete().eq('id',id);toast('Borrado','trash')}
async function saveItem(obj){
  obj.user_id=user.id;
  if(obj.id){const {id,...rest}=obj;const {data,error}=await sb.from('rt_items').update(rest).eq('id',id).select().single();if(error)throw error;items=items.map(i=>i.id===id?data:i)}
  else{const {data,error}=await sb.from('rt_items').insert(obj).select().single();if(error)throw error;items.push(data)}
}

/* ====================== Vistas ====================== */
function ring(pct,size=92){const R=size/2-9,C=2*Math.PI*R;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" stroke="rgba(120,110,200,.15)" stroke-width="10" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${R}" stroke="var(--brand)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s"/><text x="50%" y="54%" text-anchor="middle" font-size="18" font-weight="800">${Math.round(pct)}%</text></svg>`}
function habitRow(h){const done=isLogged(h.id),st=streakOf(h);
  return `<div class="row ${done?'done':''}" onclick="toggleHabit('${h.id}',this)"><span class="check ${done?'pop':''}">${done?ic('check',16):''}</span><div class="row-main"><div class="row-title">${h.emoji?h.emoji+' ':''}${esc(h.title)}</div><div class="row-sub">${h.time_of_day?`<span class="tag">${ic('bell',12)} ${hm12(h.time_of_day)}</span>`:''}${st?`<span class="streak">${ic('flame',13)} ${st} ${st===1?'día':'días'}</span>`:''}</div></div><button class="menu-btn" onclick="event.stopPropagation();openEdit('${h.id}')" aria-label="Editar">${ic('more',18)}</button></div>`}
function todoRow(t){const late=t.on_date<today();return `<div class="row ${t.done?'done':''}" onclick="toggleDone('${t.id}',this)"><span class="check ${t.done?'pop':''}">${t.done?ic('check',16):''}</span><div class="row-main"><div class="row-title">${esc(t.title)}</div>${late?`<div class="row-sub"><span class="tag warn">Pendiente de ${new Date(t.on_date+'T12:00').toLocaleDateString('es-MX',{weekday:'long'})}</span></div>`:''}</div><button class="menu-btn" onclick="event.stopPropagation();openEdit('${t.id}')" aria-label="Editar">${ic('more',18)}</button></div>`}
function reminderRow(r){const past=new Date(r.due_at)<new Date();return `<div class="row ${r.done?'done':''}" onclick="toggleDone('${r.id}',this)"><span class="check">${r.done?ic('check',16):''}</span><div class="row-main"><div class="row-title">${r.emoji?r.emoji+' ':''}${esc(r.title)}</div><div class="row-sub"><span class="tag ${past?'warn':'brand'}">${ic('clock',12)} ${fmtWhen(r.due_at)}</span></div></div><button class="menu-btn" onclick="event.stopPropagation();openEdit('${r.id}')" aria-label="Editar">${ic('more',18)}</button></div>`}
function momentsBlock(hs){
  if(!hs.length)return '';
  return ['manana','tarde','noche','cualquiera'].map(m=>{const g=hs.filter(h=>(h.moment||'cualquiera')===m).sort((a,b)=>(a.time_of_day||'99').localeCompare(b.time_of_day||'99'));if(!g.length)return '';
    const d=g.filter(h=>isLogged(h.id)).length;
    return `<section class="card"><div class="moment"><span class="dotm" style="background:var(--m-${m})"></span>${ic(MOMENTS[m].ic,16)} ${MOMENTS[m].n}<span class="prog">${d}/${g.length}</span></div>${g.map(habitRow).join('')}</section>`}).join('');
}
function notifCard(){
  const st=notifState();if(st==='on')return '';
  if(st==='unsupported-ios')return `<section class="card notif-card"><div class="notif-ic">${ic('phone',22)}</div><div class="grow"><b>Instala Ritmo para recibir avisos</b><p>En iPhone, las notificaciones solo funcionan con la app en tu pantalla de inicio:</p><ol class="steps-ios"><li>Toca el botón <b>Compartir</b> de Safari (el cuadro con flecha).</li><li>Elige <b>Agregar a pantalla de inicio</b>.</li><li>Abre Ritmo desde el ícono nuevo y activa las notificaciones aquí.</li></ol></div></section>`;

  if(st==='denied')return `<section class="card notif-card"><div class="notif-ic">${ic('bell',22)}</div><div class="grow"><b>Notificaciones bloqueadas</b><p>Actívalas en los ajustes del teléfono/navegador para Ritmo y vuelve a abrir la app.</p></div></section>`;
  return `<section class="card notif-card"><div class="notif-ic">${ic('bell',22)}</div><div class="grow"><b>Activa las notificaciones</b><p>Así te aviso a la hora de tus recordatorios y hábitos.</p><button class="btn brand sm" onclick="enablePush(this)">Activar avisos</button></div></section>`;
}
function templatesBlock(){return `<div class="section-title">Empieza con una rutina</div><div class="tpls">
  <button class="tpl t-am" onclick="addTemplate('am')"><span class="tic">${ic('sun',22)}</span><b>Mañana</b><span>Tender la cama, dientes, agua…</span></button>
  <button class="tpl t-pm" onclick="addTemplate('pm')"><span class="tic">${ic('moon',22)}</span><b>Noche</b><span>Ropa de mañana, leer, dormir…</span></button>
  <button class="tpl t-fit" onclick="addTemplate('fit')"><span class="tic">${ic('dumbbell',22)}</span><b>Salud</b><span>Ejercicio, caminar, 2 L de agua…</span></button>
  <button class="tpl t-focus" onclick="addTemplate('focus')"><span class="tic">${ic('target',22)}</span><b>Enfoque</b><span>Planear el día, leer, sin celular…</span></button></div>`}
function viewToday(){
  const hs=habitsToday(),td=todosToday(),rm=remindersUpcoming().filter(r=>new Date(r.due_at)<new Date(Date.now()+36*3600e3));
  const tot=hs.length+td.length,done=hs.filter(h=>isLogged(h.id)).length+td.filter(t=>t.done).length,pct=tot?done/tot*100:0;
  const fecha=(s=>s.charAt(0).toUpperCase()+s.slice(1))(new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}));
  const left=`<section class="hero"><div class="hero-moon">${moonSVG(96,pct===100&&tot?'celebrate':'idle')}</div><div class="hero-hello">${greeting()}${userName()?', '+esc(userName()):''}</div><div class="hero-date">${fecha}</div>${(()=>{const ds=dayStreak();return `<div class="streak-chip ${ds?'on':''}">${ic('flame',16)} ${ds?ds+' '+(ds===1?'día':'días')+' de racha':'Empieza tu racha hoy'}</div>`})()}
    <div class="hero-stats">${ring(pct)}<div><div class="hero-num">${done}<span style="font-size:22px;color:var(--muted)"> / ${tot}</span></div><div class="hero-sub">${tot?(pct===100?'¡Día completo! 🎉':'cosas hechas hoy'):'Aún no tienes nada para hoy'}</div></div></div></section>
    ${notifCard()}
    ${hs.length?`<div class="section-title">Tu rutina de hoy</div>${momentsBlock(hs)}`:templatesBlock()}`;
  const right=`${quitsBlock()}<div class="section-title">Pendientes <span class="count">${td.filter(t=>!t.done).length}</span></div><section class="card">${td.length?td.map(todoRow).join(''):`<div class="empty">${moonSVG(64,'idle')}Nada pendiente. Toca el micrófono y di, por ejemplo, <b>"comprar leche"</b>.</div>`}</section>
    <div class="section-title">Próximos avisos <button class="link" onclick="go('reminders')">Ver todos</button></div><section class="card">${rm.length?rm.slice(0,5).map(reminderRow).join(''):`<div class="empty">Di algo como <b>"mañana a las 7 ir al gym"</b> y te aviso a esa hora.</div>`}</section>`;
  return `<div class="wide"><div>${left}</div><div>${right}</div></div>`;
}
function viewHabits(){
  const hs=items.filter(i=>i.kind==='habit');
  return `<div class="section-title" style="margin-top:12px;font-size:26px">Hábitos <button class="btn sm alt" onclick="openCapture('habit')">${ic('plus',16)} Nuevo</button></div>
  <div class="wide"><div>${hs.length?['manana','tarde','noche','cualquiera'].map(m=>{const g=hs.filter(h=>(h.moment||'cualquiera')===m);if(!g.length)return '';
    return `<section class="card"><div class="moment"><span class="dotm" style="background:var(--m-${m})"></span>${ic(MOMENTS[m].ic,16)} ${MOMENTS[m].n}</div>${g.map(h=>{const st=streakOf(h),wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const sch=(h.days||[]).includes(d.getDay());const ok=isLogged(h.id,dkey(d));return `<i title="${dkey(d)}" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;background:${ok?'var(--ok)':sch?'var(--line)':'transparent'};border:${sch?'0':'1px dashed var(--line)'}"></i>`}).join('');
      return `<div class="row" onclick="openEdit('${h.id}')"><div class="row-main"><div class="row-title">${h.emoji?h.emoji+' ':''}${esc(h.title)}</div><div class="row-sub"><span>${daysLabel(h.days||[])}${h.time_of_day?' · '+hm12(h.time_of_day):''}</span></div><div style="margin-top:6px">${wk}</div></div><div class="row-end">${st?`<span class="streak">${ic('flame',14)} ${st}</span>`:''}</div></div>`}).join('')}</section>`}).join(''):templatesBlock()}</div><div></div></div>`;
}
function viewReminders(){

/* ====================== Propósitos: días sin… ====================== */
const QUIT_IDEAS=[['Sabritas y comida chatarra','🍟'],['Fumar','🚭'],['Refresco','🥤'],['Alcohol','🍺'],['Vapear','💨'],['Azúcar y dulces','🍬'],['Celular antes de dormir','📱'],['Compras por impulso','🛍️']];
const MILESTONES=[1,3,7,14,21,30,45,60,90,120,180,270,365,500,730];
function qMark(id,day){const l=qlogs.find(x=>x.quit_id===id&&x.day===day);return l?(l.clean?'ok':'bad'):null}
function qStreak(id){const d=new Date();if(qMark(id,dkey(d))!=='ok')d.setDate(d.getDate()-1);let n=0;for(let i=0;i<800;i++){if(qMark(id,dkey(d))==='ok'){n++;d.setDate(d.getDate()-1)}else break}return n}
function qBest(id){const days=qlogs.filter(l=>l.quit_id===id).sort((a,b)=>a.day.localeCompare(b.day));let best=0,run=0,prev=null;
  for(const l of days){if(!l.clean){run=0;prev=l.day;continue}const cont=prev&&(new Date(l.day+'T12:00')-new Date(prev+'T12:00'))/864e5===1;run=cont&&run?run+1:1;best=Math.max(best,run);prev=l.day}return best}
function qTotal(id){return qlogs.filter(l=>l.quit_id===id&&l.clean).length}
function qNext(n){return MILESTONES.find(m=>m>n)||n+100}
function dias(n){return n===1?'día':'días'}
function quitRow(q,withAsk=true){
  const st=qStreak(q.id),nx=qNext(st),prev=[0,...MILESTONES].filter(m=>m<=st).pop(),t=qMark(q.id,today());
  const ask=withAsk?(t==='ok'?`<div class="qdone">${ic('check',14)} Hoy lo lograste</div>`:t==='bad'?`<div class="qdone bad">Hoy recaíste. Mañana empiezas de nuevo</div>`:`<div class="qask" onclick="event.stopPropagation()"><button class="yes" onclick="markQuit('${q.id}',true,this)">Hoy lo logré</button><button class="no" onclick="markQuit('${q.id}',false,this)">Recaí</button></div>`):'';
  return `<div class="quit" onclick="openQuit('${q.id}')"><div class="qico">${q.icon||'🎯'}</div><div class="qmain"><div class="qnum">${st}<small>${dias(st)} sin</small></div><div class="qt">${esc(q.title)}</div><div class="qbar"><i style="width:${Math.min(100,(st-prev)/(nx-prev)*100)}%"></i></div>${ask}</div></div>`;
}
function quitsBlock(){
  if(!quits.length)return `<div class="section-title">Propósitos</div><section class="card"><div class="empty">${moonSVG(64,'idle')}¿Quieres dejar algo? Las Sabritas, fumar, el refresco… Cuento cuántos días llevas sin hacerlo.<button class="btn brand" style="margin-top:12px" onclick="openNewQuit()">${ic('plus',18)} Crear un propósito</button></div></section>`;
  return `<div class="section-title">Propósitos <button class="link" onclick="go('goals')">Ver todos</button></div><section class="card">${quits.map(q=>quitRow(q)).join('')}</section>`;
}
function viewGoals(){
  return `<div class="section-title" style="margin-top:12px;font-size:26px">Propósitos <button class="btn sm alt" onclick="openNewQuit()">${ic('plus',16)} Nuevo</button></div>
  <div class="wide"><div>${quits.length?`<section class="card">${quits.map(q=>quitRow(q)).join('')}</section><p class="muted small" style="margin:6px 20px;line-height:1.5">Marca cada día si lo lograste. Si se te olvidó un día, ábrelo y tócalo en el calendario.</p>`:`<section class="card"><div class="empty">${moonSVG(80,'wave')}<b>Deja algo que ya no quieres</b><br>Tú marcas cada día que no lo hiciste y yo te cuento la racha, tu récord y cuánto te ahorras.<button class="btn brand" style="margin-top:14px" onclick="openNewQuit()">${ic('plus',18)} Crear mi primer propósito</button></div></section>`}</div>
  <div>${quits.length?`<div class="section-title">Premios de racha</div><section class="card pad" style="line-height:1.9;font-size:14px">${[1,3,7,14,30,60,90,180,365].map(m=>{const got=quits.some(q=>qBest(q.id)>=m||qStreak(q.id)>=m);return `<span class="tag" style="margin:0 6px 6px 0;${got?'background:var(--ok);color:#fff':''}">${got?'★':'☆'} ${m} ${dias(m)}</span>`}).join('')}</section>`:''}</div></div>`;
}
async function markQuit(id,clean,btn,day=today()){
  if(btn)btn.disabled=true;
  const before=qStreak(id);
  const {error}=await sb.from('rt_quit_log').upsert({quit_id:id,user_id:user.id,day,clean},{onConflict:'quit_id,day'});
  if(error){if(btn)btn.disabled=false;return toast('No se pudo guardar')}
  qlogs=qlogs.filter(l=>!(l.quit_id===id&&l.day===day));qlogs.push({quit_id:id,day,clean});
  const after=qStreak(id),q=quits.find(x=>x.id===id);
  try{navigator.vibrate&&navigator.vibrate(clean?[20,40,20]:30)}catch(e){}
  if(clean&&MILESTONES.includes(after)&&after>before){render();celebrateQuit(q,after)}
  else{render();toast(clean?(after>1?`¡${after} días sin ${q.title.toLowerCase()}!`:'¡Primer día! Así se empieza'):'Está bien, mañana vuelves a empezar')}
  if(document.getElementById('overlay').classList.contains('open')&&document.getElementById('qcal'))openQuit(id,true);
}
function celebrateQuit(q,n){
  confetti(innerWidth/2,innerHeight/3);setTimeout(()=>confetti(innerWidth/3,innerHeight/2),250);
  openSheet(`<div style="text-align:center;padding:10px 0 4px">${moonSVG(130,'celebrate')}<div class="qhero"><div class="big">${n}</div><div class="lbl">${dias(n)} sin ${esc(q.title.toLowerCase())}</div></div><p class="muted" style="line-height:1.5">${n>=30?'Esto ya es un hábito nuevo. Estoy orgulloso de ti.':n>=7?'¡Una semana o más! Lo más difícil ya pasó.':'¡Vas muy bien! Cada día cuenta.'}${q.money_per_day?`<br>Llevas <b>${money(qTotal(q.id)*q.money_per_day)}</b> ahorrados.`:''}</p><button class="btn brand" onclick="closeSheet()">¡Vamos por más!</button></div>`);
}
function money(n){return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0})}
function quitCal(q){
  const k=qMonth[q.id]||today().slice(0,7);const [y,m]=k.split('-').map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();const t=today();
  let cells=['D','L','M','M','J','V','S'].map(d=>`<div class="wd">${d}</div>`).join('')+Array(first.getDay()).fill('<div></div>').join('');
  for(let d=1;d<=days;d++){const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const mk=qMark(q.id,key);
    cells+=`<button class="d ${mk||''} ${key===t?'today':''} ${key>t?'future':''} ${key<q.start_date&&!mk?'pre':''}" onclick="cycleDay('${q.id}','${key}',this)">${d}</button>`}
  const title=(s=>s.charAt(0).toUpperCase()+s.slice(1))(first.toLocaleDateString("es-MX",{month:"long",year:"numeric"}));
  const canNext=k<t.slice(0,7);
  return `<div class="cal" id="qcal"><div class="cal-h"><button onclick="shiftQMonth('${q.id}',-1)" aria-label="Mes anterior">${ic('chevL',16)}</button><b>${title}</b><button onclick="shiftQMonth('${q.id}',1)" ${canNext?'':'style="opacity:.3;pointer-events:none"'} aria-label="Mes siguiente">${ic('chevR',16)}</button></div><div class="cal-g">${cells}</div>
  <div class="cal-leg"><span><i style="background:var(--ok)"></i>Lo logré</span><span><i style="background:var(--danger)"></i>Recaí</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--line)"></i>Sin marcar</span></div></div>`;
}
function shiftQMonth(id,d){const k=qMonth[id]||today().slice(0,7);const [y,m]=k.split('-').map(Number);const n=new Date(y,m-1+d,1);qMonth[id]=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');openQuit(id,true)}
async function cycleDay(id,day,el){
  const cur=qMark(id,day);
  if(cur==='bad'){const {error}=await sb.from('rt_quit_log').delete().eq('quit_id',id).eq('day',day);if(error)return toast('No se pudo guardar');qlogs=qlogs.filter(l=>!(l.quit_id===id&&l.day===day));render();openQuit(id,true);return}
  await markQuit(id,cur!=='ok',null,day);
}
function openQuit(id,keep){
  const q=quits.find(x=>x.id===id);if(!q)return;const st=qStreak(id),best=Math.max(qBest(id),st),tot=qTotal(id),t=qMark(id,today());
  const sc=keep?document.getElementById('sheet').scrollTop:0;
  openSheet(head(`${q.icon||'🎯'} ${esc(q.title)}`,'Desde el '+new Date(q.start_date+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}))+
  `<div class="qhero"><div class="big">${st}</div><div class="lbl">${dias(st)} seguidos sin ${esc(q.title.toLowerCase())}</div><div class="muted small" style="margin-top:4px">Próxima meta: ${qNext(st)} ${dias(qNext(st))}</div></div>
  ${t?`<div style="text-align:center"><span class="qdone ${t==='bad'?'bad':''}">${t==='ok'?ic('check',14)+' Hoy ya lo marcaste':'Hoy marcaste que recaíste'}</span></div>`:`<div class="qask"><button class="yes" onclick="markQuit('${id}',true,this)">Hoy lo logré</button><button class="no" onclick="markQuit('${id}',false,this)">Recaí</button></div>`}
  <div class="qstats"><div><b>${best}</b><span>Récord</span></div><div><b>${tot}</b><span>Días logrados</span></div><div><b>${q.money_per_day?money(tot*q.money_per_day):'—'}</b><span>Ahorrado</span></div></div>
  ${q.why?`<div class="qwhy"><b>Lo hago porque:</b> ${esc(q.why)}</div>`:''}
  ${quitCal(q)}
  <p class="muted small" style="text-align:center;margin:4px 0 10px">Toca un día para marcarlo: verde (lo logré) → rojo (recaí) → sin marcar.</p>
  <div style="display:flex;gap:8px"><button class="btn alt" onclick="openNewQuit('${id}')">${ic('edit',18)} Editar</button><button class="btn alt" style="color:var(--danger)" onclick="delQuit('${id}')">${ic('trash',18)} Borrar</button></div>`);
  if(keep)document.getElementById('sheet').scrollTop=sc;
}
let qPick=null;
function openNewQuit(id){
  const q=id?quits.find(x=>x.id===id):null;qPick=q?q.icon:null;
  openSheet(head(q?'Editar propósito':'Nuevo propósito','Algo que quieres dejar de hacer')+`
  ${q?'':`<div class="qchips">${QUIT_IDEAS.map(([n,e])=>`<button onclick="pickQuitIdea(this,'${n}','${e}')">${e} ${n}</button>`).join('')}</div>`}
  <div class="field"><label>Quiero dejar…</label><input id="qTitle" value="${esc(q?.title||'')}" placeholder="Ej. Sabritas, fumar, refresco"></div>
  <div class="field"><label>¿Por qué lo haces? (opcional)</label><input id="qWhy" value="${esc(q?.why||'')}" placeholder="Ej. Para sentirme mejor y ahorrar"></div>
  <div class="field"><label>¿Cuánto gastabas en eso al día? (opcional)</label><input id="qMoney" inputmode="decimal" value="${q?.money_per_day??''}" placeholder="Ej. 25"></div>
  ${q?'':`<div class="field"><label>¿Desde cuándo lo dejaste?</label><input id="qStart" type="date" value="${today()}" max="${today()}"><div class="muted small" style="margin-top:6px">Si ya llevas días sin hacerlo, pon la fecha y los marco como logrados.</div></div>`}
  <button class="btn brand" onclick="saveQuit('${id||''}',this)">${ic('check',18)} ${q?'Guardar':'Empezar'}</button>`);
}
function pickQuitIdea(b,n,e){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('qTitle').value=n;qPick=e}
async function saveQuit(id,btn){
  const title=document.getElementById('qTitle').value.trim();if(!title)return toast('Escribe qué quieres dejar');
  const why=document.getElementById('qWhy').value.trim()||null,mp=parseFloat(document.getElementById('qMoney').value)||null;
  const icon=qPick||(QUIT_IDEAS.find(x=>x[0].toLowerCase()===title.toLowerCase())||[])[1]||'🎯';
  btn.disabled=true;
  if(id){const {error}=await sb.from('rt_quits').update({title,why,money_per_day:mp,icon}).eq('id',id);if(error){btn.disabled=false;return toast('No se pudo guardar')}Object.assign(quits.find(x=>x.id===id),{title,why,money_per_day:mp,icon});render();openQuit(id);return}
  let start=document.getElementById('qStart').value||today();if(start>today())start=today();
  const {data,error}=await sb.from('rt_quits').insert({user_id:user.id,title,why,money_per_day:mp,icon,start_date:start}).select().single();
  if(error){btn.disabled=false;return toast('No se pudo guardar')}
  quits.push(data);
  // Días anteriores a hoy desde la fecha de inicio: se marcan como logrados (máx. 2 años).
  const rows=[];const d=new Date(start+'T12:00');const t=today();
  while(dkey(d)<t&&rows.length<730){rows.push({quit_id:data.id,user_id:user.id,day:dkey(d),clean:true});d.setDate(d.getDate()+1)}
  if(rows.length){const {error:e2}=await sb.from('rt_quit_log').upsert(rows,{onConflict:'quit_id,day'});if(!e2)qlogs.push(...rows.map(r=>({quit_id:r.quit_id,day:r.day,clean:true})))}
  if(view!=='goals')go('goals');else render();
  openQuit(data.id);toast(rows.length?`¡Ya llevas ${rows.length} ${dias(rows.length)}!`:'¡Listo! Marca hoy cuando lo logres');
}
async function delQuit(id){if(!confirm('¿Borrar este propósito y su calendario?'))return;const {error}=await sb.from('rt_quits').delete().eq('id',id);if(error)return toast('No se pudo borrar');quits=quits.filter(x=>x.id!==id);qlogs=qlogs.filter(l=>l.quit_id!==id);closeSheet();render()}

/* ====================== Captura (voz o texto) ====================== */
let rec=null,listening=false,draft=null,draftForce=null;
function speechAPI(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function openCapture(force=null,typeOnly=false){
  draftForce=force;draft=null;
  const canSpeak=!!speechAPI()&&!typeOnly;
  openSheet(head('Anotar','Dilo con tus palabras. Yo detecto la fecha, la hora y si se repite.')+`
    ${canSpeak?`<div class="mic-wrap"><button class="mic" id="micBtn" onclick="toggleListen()" aria-label="Hablar">${ic('mic',40)}</button><div id="micState" class="mic-hint">Toca para hablar</div></div>`:''}
    <div class="field"><textarea id="capText" rows="2" placeholder="Ej. mañana a las 7 ir al gym" oninput="reparse()" ${canSpeak?'':'autofocus'}></textarea></div>
    ${!canSpeak?`<div class="mic-hint" style="text-align:left;margin-top:-4px">${ic('mic',14)} Tip: usa el micrófono de tu teclado para dictar.</div>`:''}
    <div id="capPreview"></div>
    <div class="mic-hint" style="margin-top:12px;text-align:left">Ejemplos: <i>"recuérdame en 20 minutos sacar la ropa"</i> · <i>"todos los días a las 8 tomar vitaminas"</i> · <i>"tender la cama en la mañana"</i> · <i>"comprar leche"</i></div>`);
  if(!canSpeak)setTimeout(()=>document.getElementById('capText')?.focus(),250);
  else setTimeout(()=>toggleListen(),250);
  reparse();
}
function toggleListen(){listening?stopListening():startListening()}
function startListening(){
  const SR=speechAPI();if(!SR)return;
  try{rec=new SR()}catch(e){return}
  rec.lang='es-MX';rec.interimResults=true;rec.continuous=false;
  const base=(document.getElementById('capText')?.value||'').trim();
  rec.onresult=e=>{let txt='';for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;const ta=document.getElementById('capText');if(ta){ta.value=(base?base+' ':'')+txt;reparse()}};
  rec.onerror=e=>{const s=document.getElementById('micState');if(s)s.innerHTML=e.error==='not-allowed'?'Permite el micrófono o usa el del teclado.':'No te escuché bien. Intenta otra vez o escríbelo.';stopListening(true)};
  rec.onend=()=>stopListening(true);
  try{rec.start();listening=true;const b=document.getElementById('micBtn');if(b)b.classList.add('rec');const s=document.getElementById('micState');if(s)s.innerHTML='<div class="bars"><i></i><i></i><i></i><i></i><i></i></div>'}catch(e){listening=false}
}
function stopListening(silent){if(rec){try{rec.stop()}catch(e){}}rec=null;listening=false;const b=document.getElementById('micBtn');if(b)b.classList.remove('rec');const s=document.getElementById('micState');if(s&&s.querySelector('.bars'))s.textContent='Toca para hablar otra vez'}
function reparse(){
  const txt=(document.getElementById('capText')?.value||'').trim(),box=document.getElementById('capPreview');if(!box)return;
  if(!txt){box.innerHTML='';draft=null;return}
  draft=parseDictation(txt);
  if(draftForce&&draftForce!==draft.kind){draft.kind=draftForce;if(draftForce==='reminder'&&!draft.due){const d=new Date(Date.now()+3600e3);d.setMinutes(0,0,0);draft.due=d}}
  renderDraft();
}
function renderDraft(){
  const d=draft,box=document.getElementById('capPreview');if(!d||!box)return;
  const toLocalInput=dt=>{const x=new Date(dt);return `${dkey(x)}T${pad(x.getHours())}:${pad(x.getMinutes())}`};
  const summary=d.kind==='reminder'?`Te aviso ${fmtWhen(d.due).toLowerCase()}`:d.kind==='habit'?`${daysLabel(d.days)}${d.time?' a las '+hm12(d.time):''} · ${MOMENTS[d.moment].n}`:'Pendiente de hoy';
  box.innerHTML=`<div class="preview"><div class="pic">${ic(d.kind==='reminder'?'bell':d.kind==='habit'?'repeat':'list',20)}</div><div class="grow"><b>${esc(d.title||'…')}</b><span>${summary}</span></div></div>
  <div class="field"><label>Tipo</label><div class="seg">${[['reminder','Recordatorio'],['habit','Hábito'],['todo','Pendiente']].map(([k,n])=>`<button class="${d.kind===k?'on':''}" onclick="setKind('${k}')">${n}</button>`).join('')}</div></div>
  <div class="field"><label>Qué</label><input id="dTitle" value="${esc(d.title)}" oninput="draft.title=this.value"></div>
  ${d.kind==='reminder'?`<div class="field"><label>Cuándo</label><input id="dDue" type="datetime-local" value="${toLocalInput(d.due||new Date(Date.now()+3600e3))}" onchange="draft.due=new Date(this.value)"></div>`:''}
  ${d.kind==='habit'?`<div class="field"><label>Días</label><div class="days">${DAYN.map((n,i)=>`<button class="${d.days.includes(i)?'on':''}" onclick="toggleDay(${i})">${n}</button>`).join('')}</div></div>
    <div class="two"><div class="field"><label>Momento</label><select onchange="draft.moment=this.value">${Object.entries(MOMENTS).map(([k,v])=>`<option value="${k}" ${d.moment===k?'selected':''}>${v.n}</option>`).join('')}</select></div>
    <div class="field"><label>Aviso (opcional)</label><input type="time" value="${d.time||''}" onchange="draft.time=this.value||null"></div></div>`:''}
  <button class="btn brand" onclick="saveDraft(this)">${ic('check',18)} Guardar</button>`;
  hydrateIcons(box);
}
function setKind(k){draft.kind=k;draftForce=k;if(k==='reminder'&&!draft.due){const d=new Date(Date.now()+3600e3);d.setMinutes(0,0,0);draft.due=d}renderDraft()}
function toggleDay(i){draft.days=draft.days.includes(i)?draft.days.filter(x=>x!==i):[...draft.days,i].sort();if(!draft.days.length)draft.days=[i];renderDraft()}
async function saveDraft(btn){
  const d=draft;if(!d||!(d.title||'').trim()){alert('Escribe o di qué quieres anotar.');return}
  const row={kind:d.kind,title:d.title.trim(),sort:items.length};
  if(d.kind==='reminder'){if(!d.due||isNaN(new Date(d.due))){alert('Elige la fecha y hora.');return}row.due_at=new Date(d.due).toISOString();row.notified=new Date(d.due)<new Date()}
  if(d.kind==='habit'){row.days=d.days;row.moment=d.moment;row.time_of_day=d.time||null}
  if(d.kind==='todo'){row.on_date=d.onDate||today()}
  btn.disabled=true;
  try{await saveItem(row);closeSheet();render();toast(d.kind==='reminder'?'Listo, te aviso '+fmtWhen(row.due_at).toLowerCase():d.kind==='habit'?'Hábito agregado a tu rutina':'Anotado en pendientes')
    if(d.kind!=='todo'&&notifState()==='default')setTimeout(()=>toast('Activa las notificaciones en Ajustes para recibir el aviso','bell'),2100)}
  catch(e){console.error(e);alert('No se pudo guardar. Revisa tu conexión.');btn.disabled=false}
}
function openEdit(id){
  const it=items.find(i=>i.id===id);if(!it)return;
  draft={kind:it.kind,title:it.title,due:it.due_at?new Date(it.due_at):null,time:it.time_of_day,days:it.days||[0,1,2,3,4,5,6],moment:it.moment||'cualquiera',onDate:it.on_date,_id:id,_emoji:it.emoji};draftForce=it.kind;
  openSheet(head('Editar','')+`<div id="capPreview"></div><button class="btn alt" style="color:var(--danger)" onclick="removeItem('${id}')">${ic('trash',18)} Borrar</button>`);
  renderDraft();
  const b=document.querySelector('#capPreview .btn');b.setAttribute('onclick','saveEdit(this)');
}
async function saveEdit(btn){
  const d=draft,row={id:d._id,kind:d.kind,title:(d.title||'').trim()};if(!row.title)return;
  row.due_at=d.kind==='reminder'?new Date(d.due).toISOString():null;if(d.kind==='reminder'){row.notified=new Date(d.due)<new Date();row.done=false}
  row.days=d.days;row.moment=d.moment;row.time_of_day=d.kind==='habit'?(d.time||null):null;row.last_notified_date=null;
  row.on_date=d.kind==='todo'?(d.onDate||today()):null;
  btn.disabled=true;try{await saveItem(row);closeSheet();render();toast('Guardado')}catch(e){alert('No se pudo guardar.');btn.disabled=false}
}

/* ====================== Notificaciones ====================== */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function notifState(){
  if(localStorage.getItem('ritmo_push')==='on'&&'Notification' in window&&Notification.permission==='granted')return 'on';
  if(isIOS&&!isStandalone)return 'unsupported-ios';
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return 'unsupported';
  if(Notification.permission==='denied')return 'denied';
  return 'default';
}
function b64ToU8(b){const p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...s].map(c=>c.charCodeAt(0)))}
async function enablePush(btn){
  try{
    if(btn)btn.disabled=true;
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Sin permiso no te puedo avisar','bell');render();return}
    const reg=await navigator.serviceWorker.ready;
    const {publicKey}=await (await fetch('/api/vapid')).json();
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(publicKey)});
    const j=sub.toJSON();
    const {error}=await sb.from('rt_push_subs').upsert({user_id:user.id,app:'ritmo',endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,tz:Intl.DateTimeFormat().resolvedOptions().timeZone},{onConflict:'endpoint'});
    if(error)throw error;
    localStorage.setItem('ritmo_push','on');render();toast('¡Avisos activados!','bell');
  }catch(e){console.error(e);alert('No se pudieron activar los avisos: '+(e.message||e));if(btn)btn.disabled=false}
}
async function testPush(btn){
  btn.disabled=true;const {data:{session}}=await sb.auth.getSession();
  const r=await fetch('/api/test-push',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({app:'ritmo'})});const j=await r.json();
  btn.disabled=false;toast(r.ok?'Enviada, revisa tus notificaciones':'No se pudo: '+(j.error||r.status),r.ok?'send':'bell');
}

/* ====================== Arranque ====================== */
async function start(u,isNew){
  user=u;document.getElementById('auth').classList.remove('open');
  await loadData();buildNav();
  const q=new URLSearchParams(location.search).get('view');if(q&&['today','habits','reminders','settings','goals'].includes(q))view=q;
  render();hideSplash();
  if(isNew)setTimeout(()=>toast('¡Bienvenid@, '+userName()+'! Elige una rutina para empezar','repeat'),500);
}
function hideSplash(){const s=document.getElementById('splash');if(s&&!s.classList.contains('hide')){s.classList.add('hide');setTimeout(()=>s.remove(),400)}}
(async function boot(){
  applyTheme();
  document.getElementById('splashLogo').innerHTML=moonSVG(130,'wave');
  document.getElementById('authLogo').innerHTML=moonSVG(140,'wave');
  document.getElementById('topLogo').innerHTML=logoHTML(34);
  hydrateIcons();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e));
  const {data:{session}}=await sb.auth.getSession();
  if(session)await start(session.user);else{document.getElementById('auth').classList.add('open');hideSplash()}
  setTimeout(hideSplash,6000);
})();
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&user){await loadData();render()}});
</script>
